<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <g transform="translate(10, 10)">
    <!-- Rabbit Head Contour based on official Grabb-it logo -->
    <!-- Left Ear -->
    <path d="M 40 40 C 20 -10, 30 -10, 50 35 L 60 55 Z" fill="#111111" />
    <path d="M 43 35 C 30 0, 35 0, 48 33 Z" fill="#FFFFFF" />
    
    <!-- Right Ear -->
    <path d="M 80 40 C 100 -10, 90 -10, 70 35 L 60 55 Z" fill="#111111" />
    <path d="M 77 35 C 90 0, 85 0, 72 33 Z" fill="#FFFFFF" />

    <!-- Head & Cheeks -->
    <path d="M 35 55 C 20 70, 30 95, 60 98 C 90 95, 100 70, 85 55 C 75 45, 45 45, 35 55 Z" fill="#111111" />

    <!-- Eyes (Angled almond cutouts) -->
    <ellipse cx="48" cy="68" rx="4" ry="7" transform="rotate(-15 48 68)" fill="#FFFFFF" />
    <ellipse cx="72" cy="68" rx="4" ry="7" transform="rotate(15 72 68)" fill="#FFFFFF" />

    <!-- Nose & Mouth (Heart nose) -->
    <path d="M 60 80 L 55 75 C 53 73, 56 70, 60 72 C 64 70, 67 73, 65 75 Z" fill="#FFFFFF" />
    <path d="M 60 80 L 60 84 C 55 86, 52 86, 50 84 M 60 84 C 65 86, 68 86, 70 84" stroke="#FFFFFF" stroke-width="2" fill="none" stroke-linecap="round" />

    <!-- Whiskers -->
    <line x1="20" y1="74" x2="38" y2="76" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    <line x1="18" y1="82" x2="36" y2="81" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    
    <line x1="100" y1="74" x2="82" y2="76" stroke="#111111" stroke-width="3" stroke-linecap="round" />
    <line x1="102" y1="82" x2="84" y2="81" stroke="#111111" stroke-width="3" stroke-linecap="round" />
  </g>

  <!-- Typography -->
  <text x="130" y="70" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="38" font-weight="900" letter-spacing="4" fill="#111111">GRABB-IT</text>
  <text x="132" y="88" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="10" font-weight="700" letter-spacing="5" fill="#666666">CLOTHING &amp; APPAREL</text>
</svg>
